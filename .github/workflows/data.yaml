name: Update Site Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly Sunday UTC

permissions:
  contents: write

jobs:
  spotify:
    name: Fetch Spotify data
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Spotify data
        env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -s -X POST https://accounts.spotify.com/api/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d grant_type=refresh_token \
            -d refresh_token="$REFRESH_TOKEN" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            | jq -r .access_token)

          curl -s "https://api.spotify.com/v1/me/top/artists?limit=10&time_range=medium_term" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            | jq .items \
            > top-artists.json

      - name: Upload Spotify data
        uses: actions/upload-artifact@v7
        with:
          name: spotify-data
          path: top-artists.json


  modpack-index:
    name: Fetch Modpack Index data
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Modpack Index data
        run: |
          curl -s https://www.modpackindex.com/api/v1/author/2186 \
            | jq '{ total_downloads: (.data.mods | map(.download_count) | add) }' \
            > modpack-index.json

      - name: Upload Modpack Index data
        uses: actions/upload-artifact@v7
        with:
          name: modpack-index-data
          path: modpack-index.json


  commit:
    name: Commit site data
    runs-on: ubuntu-latest
    needs:
      - spotify
      - modpack-index

    steps:
      - name: Checkout site-data branch
        uses: actions/checkout@v7
        with:
          ref: site-data

      - name: Download Spotify data
        uses: actions/download-artifact@v8
        with:
          name: spotify-data
          path: data

      - name: Download Modpack Index data
        uses: actions/download-artifact@v8
        with:
          name: modpack-index-data
          path: data

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add data

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update site data"
          git push origin site-data